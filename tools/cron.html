<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron 表达式 - DevToolBox</title>
  <meta name="description" content="在线Cron表达式解析生成器，可视化编辑，显示下次执行时间">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .cron-input-row { display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-end; flex-wrap: wrap; }
    .cron-field { display: flex; flex-direction: column; gap: 4px; }
    .cron-field label { font-size: 11px; color: #888; text-transform: uppercase; }
    .cron-field input {
      width: 80px; background: #2a2a3e; border: 1px solid #3a3a5e; color: #e0e0e0;
      padding: 8px 10px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 14px; text-align: center;
    }
    .result-box { background: #1e1e2e; border: 1px solid #3a3a5e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .result-box .label { font-size: 13px; color: #888; margin-bottom: 8px; }
    .result-box .desc { font-size: 16px; color: #6cf; font-weight: bold; }
    .next-times { list-style: none; padding: 0; margin: 8px 0 0 0; }
    .next-times li { padding: 6px 0; color: #ccc; border-bottom: 1px solid #2a2a3e; font-family: 'Consolas', monospace; font-size: 14px; }
    .next-times li:last-child { border-bottom: none; }
    .templates { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .templates button { font-size: 12px; padding: 6px 12px; }
    .section-title { font-size: 14px; color: #aaa; margin: 16px 0 8px 0; font-weight: 600; }
    .tabs { display: flex; gap: 0; margin-bottom: 16px; border: 1px solid #3a3a5e; border-radius: 8px; overflow: hidden; }
    .tabs button { flex: 1; padding: 8px 12px; background: #1e1e2e; border: none; color: #aaa; cursor: pointer; font-size: 13px; }
    .tabs button.active { background: #6c63ff; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .visual-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .visual-field { display: flex; flex-direction: column; gap: 4px; }
    .visual-field label { font-size: 12px; color: #888; }
    .visual-field select {
      background: #2a2a3e; border: 1px solid #3a3a5e; color: #e0e0e0;
      padding: 6px 10px; border-radius: 6px; min-width: 100px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回工具箱</a>
    <div class="tool-page">
      <div class="tool-header">
        <h1>⏰ Cron 表达式解析</h1>
        <p>解析和生成 Cron 表达式，可视化编辑，预览下次执行时间</p>
      </div>

      <div class="section-title">常用模板</div>
      <div class="templates">
        <button class="btn btn-secondary" onclick="setTemplate('* * * * *')">每分钟</button>
        <button class="btn btn-secondary" onclick="setTemplate('0 * * * *')">每小时</button>
        <button class="btn btn-secondary" onclick="setTemplate('0 0 * * *')">每天 0 点</button>
        <button class="btn btn-secondary" onclick="setTemplate('0 12 * * *')">每天中午 12 点</button>
        <button class="btn btn-secondary" onclick="setTemplate('0 0 * * 1')">每周一 0 点</button>
        <button class="btn btn-secondary" onclick="setTemplate('0 0 1 * *')">每月 1 号 0 点</button>
        <button class="btn btn-secondary" onclick="setTemplate('0 0 1 1 *')">每年 1 月 1 日</button>
        <button class="btn btn-secondary" onclick="setTemplate('*/5 * * * *')">每 5 分钟</button>
        <button class="btn btn-secondary" onclick="setTemplate('0 */2 * * *')">每 2 小时</button>
        <button class="btn btn-secondary" onclick="setTemplate('30 6 * * 1-5')">工作日 6:30</button>
      </div>

      <div class="tabs">
        <button class="active" onclick="switchTab('manual')">手动输入</button>
        <button onclick="switchTab('visual')">可视化选择</button>
      </div>

      <div id="tab-manual" class="tab-content active">
        <div class="cron-input-row">
          <div class="cron-field"><label>分钟</label><input id="f0" value="*" oninput="parse()"></div>
          <div class="cron-field"><label>小时</label><input id="f1" value="*" oninput="parse()"></div>
          <div class="cron-field"><label>日</label><input id="f2" value="*" oninput="parse()"></div>
          <div class="cron-field"><label>月</label><input id="f3" value="*" oninput="parse()"></div>
          <div class="cron-field"><label>星期</label><input id="f4" value="*" oninput="parse()"></div>
        </div>
      </div>

      <div id="tab-visual" class="tab-content">
        <div class="visual-row">
          <div class="visual-field">
            <label>分钟</label>
            <select id="v0" onchange="fromVisual()">
              <option value="*">每分钟</option>
              <option value="0">第 0 分钟</option>
              <option value="15">第 15 分钟</option>
              <option value="30">第 30 分钟</option>
              <option value="45">第 45 分钟</option>
              <option value="*/5">每 5 分钟</option>
              <option value="*/10">每 10 分钟</option>
              <option value="*/15">每 15 分钟</option>
              <option value="*/30">每 30 分钟</option>
            </select>
          </div>
          <div class="visual-field">
            <label>小时</label>
            <select id="v1" onchange="fromVisual()">
              <option value="*">每小时</option>
              <option value="0">0 点</option>
              <option value="6">6 点</option>
              <option value="8">8 点</option>
              <option value="12">12 点</option>
              <option value="18">18 点</option>
              <option value="*/2">每 2 小时</option>
              <option value="*/3">每 3 小时</option>
              <option value="*/6">每 6 小时</option>
            </select>
          </div>
          <div class="visual-field">
            <label>日</label>
            <select id="v2" onchange="fromVisual()">
              <option value="*">每天</option>
              <option value="1">1 号</option>
              <option value="15">15 号</option>
              <option value="*/2">每隔 2 天</option>
            </select>
          </div>
          <div class="visual-field">
            <label>月</label>
            <select id="v3" onchange="fromVisual()">
              <option value="*">每月</option>
              <option value="1">1 月</option>
              <option value="*/2">每隔 2 月</option>
              <option value="*/3">每隔 3 月</option>
              <option value="*/6">每隔 6 月</option>
            </select>
          </div>
          <div class="visual-field">
            <label>星期</label>
            <select id="v4" onchange="fromVisual()">
              <option value="*">每天</option>
              <option value="0">周日</option>
              <option value="1">周一</option>
              <option value="2">周二</option>
              <option value="3">周三</option>
              <option value="4">周四</option>
              <option value="5">周五</option>
              <option value="6">周六</option>
              <option value="1-5">周一至周五</option>
              <option value="0,6">周末</option>
            </select>
          </div>
        </div>
      </div>

      <div class="result-box">
        <div class="label">Cron 表达式</div>
        <div class="desc" id="cronExpr" style="font-size:18px;color:#8f8;margin-bottom:12px;">* * * * *</div>
        <div class="label">中文描述</div>
        <div class="desc" id="cronDesc">每分钟执行一次</div>
      </div>

      <div class="result-box">
        <div class="label">接下来 5 次执行时间</div>
        <ul class="next-times" id="nextTimes"></ul>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">已复制</div>
  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg || '已复制';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function switchTab(name) {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
    }

    function setTemplate(expr) {
      const parts = expr.split(' ');
      for (let i = 0; i < 5; i++) document.getElementById('f' + i).value = parts[i] || '*';
      parse();
    }

    function fromVisual() {
      for (let i = 0; i < 5; i++) document.getElementById('f' + i).value = document.getElementById('v' + i).value;
      parse();
    }

    function getExpr() {
      return [0,1,2,3,4].map(i => document.getElementById('f' + i).value).join(' ');
    }

    function parseField(field, name) {
      if (field === '*') return '每' + name;
      if (field.startsWith('*/')) return '每隔 ' + field.slice(2) + ' ' + name;
      if (field.includes('-')) {
        const [a, b] = field.split('-');
        return name + ' ' + a + ' 到 ' + b;
      }
      if (field.includes(',')) return name + ' ' + field;
      return name + ' ' + field;
    }

    const weekNames = ['日','一','二','三','四','五','六'];
    function parseWeekday(field) {
      if (field === '*') return '每天';
      if (field.includes('-')) {
        const [a, b] = field.split('-');
        return '周' + weekNames[parseInt(a)] + ' 到 周' + weekNames[parseInt(b)];
      }
      if (field.includes(',')) {
        return field.split(',').map(n => '周' + weekNames[parseInt(n)]).join('、');
      }
      return '周' + weekNames[parseInt(field)];
    }

    function describe(expr) {
      const p = expr.split(' ');
      const min = parseField(p[0], '分钟');
      const hour = p[1] === '*' ? '每小时' : (p[1].startsWith('*/') ? '每隔 ' + p[1].slice(2) + ' 小时' : p[1] + ' 点');
      const day = parseField(p[2], '日');
      const month = parseField(p[3], '月');
      const week = parseWeekday(p[4]);

      let desc = '';
      if (p[0] !== '*') desc += '在 ' + p[0] + ' 分钟时，';
      if (p[1] !== '*') desc += p[1].startsWith('*/') ? '每隔 ' + p[1].slice(2) + ' 小时，' : '在 ' + p[1] + ' 点，';
      if (p[2] !== '*') desc += parseField(p[2], '每月第') + ' 日，';
      if (p[3] !== '*') desc += parseField(p[3], '每') + ' 月，';
      if (p[4] !== '*') desc += parseWeekday(p[4]) + '，';
      desc += '执行一次';

      // Simplify common patterns
      if (expr === '* * * * *') return '每分钟执行一次';
      if (expr === '0 * * * *') return '每小时整点执行一次';
      if (expr === '0 0 * * *') return '每天凌晨 0 点执行一次';
      if (expr === '0 12 * * *') return '每天中午 12 点执行一次';
      if (expr === '0 0 * * 1') return '每周一凌晨 0 点执行一次';
      if (expr === '0 0 1 * *') return '每月 1 号凌晨 0 点执行一次';
      if (expr === '0 0 1 1 *') return '每年 1 月 1 日凌晨 0 点执行一次';
      if (expr === '*/5 * * * *') return '每隔 5 分钟执行一次';
      if (expr === '0 */2 * * *') return '每隔 2 小时整点执行一次';
      if (expr === '30 6 * * 1-5') return '工作日 6:30 执行一次';

      return desc;
    }

    function expandField(field, min, max) {
      let values = new Set();
      field.split(',').forEach(part => {
        if (part === '*') { for (let i = min; i <= max; i++) values.add(i); }
        else if (part.startsWith('*/')) {
          const step = parseInt(part.slice(2));
          for (let i = min; i <= max; i += step) values.add(i);
        } else if (part.includes('-')) {
          const [a, b] = part.split('-').map(Number);
          for (let i = a; i <= b; i++) values.add(i);
        } else {
          values.add(parseInt(part));
        }
      });
      return [...values].sort((a, b) => a - b);
    }

    function getNextTimes(expr, count = 5) {
      const p = expr.split(' ');
      const minutes = expandField(p[0], 0, 59);
      const hours = expandField(p[1], 0, 23);
      const days = expandField(p[2], 1, 31);
      const months = expandField(p[3], 1, 12);
      const weekdays = expandField(p[4], 0, 6);

      let results = [];
      let now = new Date();
      now.setSeconds(0, 0);
      now.setMinutes(now.getMinutes() + 1);

      let d = new Date(now);
      // Search up to 2 years ahead
      const limit = new Date(now);
      limit.setFullYear(limit.getFullYear() + 2);

      while (results.length < count && d < limit) {
        if (months.includes(d.getMonth() + 1) &&
            days.includes(d.getDate()) &&
            weekdays.includes(d.getDay()) &&
            hours.includes(d.getHours()) &&
            minutes.includes(d.getMinutes())) {
          results.push(new Date(d));
          d.setMinutes(d.getMinutes() + 1);
          continue;
        }
        d.setMinutes(d.getMinutes() + 1);
      }
      return results;
    }

    function parse() {
      const expr = getExpr();
      document.getElementById('cronExpr').textContent = expr;
      document.getElementById('cronDesc').textContent = describe(expr);

      try {
        const times = getNextTimes(expr, 5);
        const list = document.getElementById('nextTimes');
        list.innerHTML = '';
        times.forEach(t => {
          const li = document.createElement('li');
          li.textContent = t.getFullYear() + '-' +
            String(t.getMonth()+1).padStart(2,'0') + '-' +
            String(t.getDate()).padStart(2,'0') + ' ' +
            String(t.getHours()).padStart(2,'0') + ':' +
            String(t.getMinutes()).padStart(2,'0') + ':00';
          list.appendChild(li);
        });
        if (times.length === 0) {
          list.innerHTML = '<li style="color:#f66;">未找到匹配的执行时间</li>';
        }
      } catch(e) {
        document.getElementById('nextTimes').innerHTML = '<li style="color:#f66;">表达式格式错误</li>';
      }
    }

    parse();
  </script>
</body>
</html>
