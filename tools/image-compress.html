<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片压缩 - DevToolBox</title>
  <meta name="description" content="在线图片压缩工具，支持JPEG/PNG/WebP格式，客户端本地压缩">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .upload-zone {
      border: 2px dashed #3a3a5e; border-radius: 12px; padding: 40px; text-align: center;
      cursor: pointer; transition: all 0.3s; background: #1e1e2e; margin-bottom: 20px;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: #6c63ff; background: #1a1a3e; }
    .upload-zone .icon { font-size: 48px; margin-bottom: 12px; }
    .upload-zone .text { color: #aaa; font-size: 14px; }
    .upload-zone .text span { color: #6c63ff; font-weight: 600; }
    input[type="file"] { display: none; }
    .controls-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; }
    .option-group { display: flex; flex-direction: column; gap: 6px; }
    .option-group label { font-size: 13px; color: #aaa; }
    .option-group select, .option-group input[type="range"] {
      background: #2a2a3e; border: 1px solid #3a3a5e; color: #e0e0e0; padding: 8px 12px; border-radius: 6px;
    }
    .option-group input[type="range"] { width: 200px; accent-color: #6c63ff; }
    .quality-display { font-size: 14px; color: #6cf; font-weight: 600; }
    .stats-row { display: flex; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card {
      background: #1e1e2e; border: 1px solid #3a3a5e; border-radius: 8px; padding: 16px;
      flex: 1; min-width: 150px; text-align: center;
    }
    .stat-card .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .stat-card .stat-value { font-size: 18px; font-weight: 600; color: #e0e0e0; }
    .stat-card .stat-value.success { color: #4f4; }
    .stat-card .stat-value.warning { color: #ff0; }
    .preview-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .preview-card { flex: 1; min-width: 250px; }
    .preview-card .label { font-size: 13px; color: #aaa; margin-bottom: 8px; }
    .preview-card img {
      width: 100%; max-height: 400px; object-fit: contain; background: #1a1a2e;
      border: 1px solid #3a3a5e; border-radius: 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回工具箱</a>
    <div class="tool-page">
      <div class="tool-header">
        <h1>🖼️ 图片压缩</h1>
        <p>客户端本地压缩图片，支持 JPEG/PNG/WebP 格式，无需上传服务器</p>
      </div>

      <div class="upload-zone" id="dropZone">
        <div class="icon">📁</div>
        <div class="text">拖拽图片到此处，或 <span>点击选择文件</span></div>
        <div class="text" style="margin-top:8px;font-size:12px;">支持 JPG、PNG、WebP、GIF 格式</div>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <div id="compressSection" class="hidden">
        <div class="controls-row">
          <div class="option-group">
            <label>压缩质量：<span class="quality-display" id="qualityDisplay">80%</span></label>
            <input type="range" id="quality" min="1" max="100" value="80" oninput="updateQuality()">
          </div>
          <div class="option-group">
            <label>输出格式</label>
            <select id="format" onchange="compress()">
              <option value="image/jpeg">JPEG</option>
              <option value="image/png">PNG</option>
              <option value="image/webp" selected>WebP</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="compress()">压缩</button>
          <button class="btn btn-secondary" onclick="download()">下载</button>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">原始大小</div>
            <div class="stat-value" id="origSize">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">压缩后大小</div>
            <div class="stat-value" id="compSize">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">压缩率</div>
            <div class="stat-value" id="ratio">-</div>
          </div>
        </div>

        <div class="preview-row">
          <div class="preview-card">
            <div class="label">原图预览</div>
            <img id="origPreview" alt="原图">
          </div>
          <div class="preview-card">
            <div class="label">压缩后预览</div>
            <img id="compPreview" alt="压缩后">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">已复制</div>
  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg || '已复制';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    let originalFile = null;
    let compressedBlob = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showToast('请选择图片文件');
        return;
      }
      originalFile = file;
      document.getElementById('origSize').textContent = formatSize(file.size);
      document.getElementById('origPreview').src = URL.createObjectURL(file);
      document.getElementById('compressSection').classList.remove('hidden');
      compress();
    }

    function updateQuality() {
      document.getElementById('qualityDisplay').textContent = document.getElementById('quality').value + '%';
    }

    function compress() {
      if (!originalFile) return;
      const quality = parseInt(document.getElementById('quality').value) / 100;
      const format = document.getElementById('format').value;

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        canvas.toBlob(blob => {
          if (!blob) { showToast('压缩失败，请尝试其他格式'); return; }
          compressedBlob = blob;
          document.getElementById('compSize').textContent = formatSize(blob.size);
          document.getElementById('compPreview').src = URL.createObjectURL(blob);

          const ratio = ((1 - blob.size / originalFile.size) * 100).toFixed(1);
          const ratioEl = document.getElementById('ratio');
          ratioEl.textContent = ratio + '%';
          if (ratio > 0) {
            ratioEl.classList.add('success');
            ratioEl.classList.remove('warning');
          } else {
            ratioEl.classList.remove('success');
            ratioEl.classList.add('warning');
          }
        }, format, quality);
      };
      img.src = URL.createObjectURL(originalFile);
    }

    function download() {
      if (!compressedBlob) return;
      const ext = document.getElementById('format').value.split('/')[1];
      const name = (originalFile.name.replace(/\.[^.]+$/, '') || 'compressed') + '_compressed.' + ext;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(compressedBlob);
      a.download = name;
      a.click();
    }
  </script>
</body>
</html>
