<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器 - DevToolBox</title>
  <meta name="description" content="安全随机密码生成器，支持自定义长度、字符类型和强度检测">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .password-display { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; font-family: 'Consolas', 'Monaco', monospace; font-size: 24px; text-align: center; word-break: break-all; color: var(--accent); min-height: 70px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; letter-spacing: 2px; }
    .strength-bar { height: 8px; border-radius: 4px; background: var(--surface2); margin: 8px 0 4px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; }
    .strength-label { font-size: 13px; margin-bottom: 16px; }
    .slider-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .slider-row .length-val { font-family: 'Consolas', monospace; color: var(--accent); font-size: 20px; font-weight: 700; min-width: 36px; text-align: right; }
    .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    @media (max-width: 500px) { .checkbox-group { grid-template-columns: 1fr; } }
    .checkbox-item { display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: border-color 0.2s; }
    .checkbox-item:hover { border-color: var(--accent); }
    .checkbox-item input { width: 18px; height: 18px; accent-color: var(--accent); }
    .checkbox-item label { color: var(--text2); font-size: 14px; cursor: pointer; }
    .batch-area { margin-top: 24px; }
    .batch-list { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Consolas', monospace; font-size: 13px; }
    .batch-item { padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .batch-item:last-child { border-bottom: none; }
    .batch-item .pw { color: var(--text); word-break: break-all; flex: 1; }
    .batch-item button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 8px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回工具箱</a>
    <div class="tool-page">
      <div class="tool-header">
        <h1>🔑 密码生成器</h1>
        <p>生成安全随机密码，支持自定义长度、字符类型和强度检测</p>
      </div>

      <div class="password-display" id="passwordDisplay">点击生成按钮开始</div>

      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel" style="color:var(--text2);">-</div>

      <div class="label">密码长度</div>
      <div class="slider-row">
        <input type="range" id="lengthSlider" min="8" max="64" value="16" oninput="document.getElementById('lengthVal').textContent=this.value">
        <span class="length-val" id="lengthVal">16</span>
      </div>

      <div class="label">字符类型</div>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="upper" checked>
          <label for="upper">大写字母 A-Z</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="lower" checked>
          <label for="lower">小写字母 a-z</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="numbers" checked>
          <label for="numbers">数字 0-9</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="symbols" checked>
          <label for="symbols">特殊符号 !@#$...</label>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="generate()">生成密码</button>
        <button class="btn btn-secondary" onclick="copyPassword()">复制密码</button>
        <button class="btn btn-secondary" onclick="batchGenerate()">批量生成 5 个</button>
      </div>

      <div class="batch-area" id="batchArea" style="display:none;">
        <div class="label">批量生成的密码</div>
        <div class="batch-list" id="batchList"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">已复制</div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg || '已复制';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    const CHARS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    function getCharset() {
      let chars = '';
      if (document.getElementById('upper').checked) chars += CHARS.upper;
      if (document.getElementById('lower').checked) chars += CHARS.lower;
      if (document.getElementById('numbers').checked) chars += CHARS.numbers;
      if (document.getElementById('symbols').checked) chars += CHARS.symbols;
      return chars;
    }

    function randomChar(chars) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return chars[arr[0] % chars.length];
    }

    function generatePassword(length) {
      const chars = getCharset();
      if (!chars) return '';
      let pw = '';
      for (let i = 0; i < length; i++) {
        pw += randomChar(chars);
      }
      return pw;
    }

    function getStrength(pw) {
      if (!pw) return { score: 0, label: '-', color: 'var(--text2)' };
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (pw.length >= 20) score++;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
      if (/\d/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;
      if (new Set(pw).size > pw.length * 0.7) score++;

      if (score <= 2) return { score: 25, label: '弱', color: '#f87171' };
      if (score <= 4) return { score: 50, label: '中等', color: '#fbbf24' };
      if (score <= 6) return { score: 75, label: '强', color: '#34d399' };
      return { score: 100, label: '非常强', color: '#22d3ee' };
    }

    function updateStrength(pw) {
      const s = getStrength(pw);
      document.getElementById('strengthFill').style.width = s.score + '%';
      document.getElementById('strengthFill').style.background = s.color;
      document.getElementById('strengthLabel').textContent = '强度：' + s.label;
      document.getElementById('strengthLabel').style.color = s.color;
    }

    function generate() {
      if (!getCharset()) { showToast('请至少选择一种字符类型'); return; }
      const len = parseInt(document.getElementById('lengthSlider').value);
      const pw = generatePassword(len);
      document.getElementById('passwordDisplay').textContent = pw;
      updateStrength(pw);
    }

    function copyPassword() {
      const pw = document.getElementById('passwordDisplay').textContent;
      if (!pw || pw === '点击生成按钮开始') { showToast('请先生成密码'); return; }
      navigator.clipboard.writeText(pw).then(() => showToast('已复制到剪贴板'));
    }

    function batchGenerate() {
      if (!getCharset()) { showToast('请至少选择一种字符类型'); return; }
      const len = parseInt(document.getElementById('lengthSlider').value);
      const list = document.getElementById('batchList');
      let html = '';
      for (let i = 0; i < 5; i++) {
        const pw = generatePassword(len);
        html += `<div class="batch-item"><span class="pw">${escapeHtml(pw)}</span><button onclick="copyText('${escapeHtml(pw)}')">复制</button></div>`;
      }
      list.innerHTML = html;
      document.getElementById('batchArea').style.display = 'block';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function copyText(text) {
      // Unescape HTML entities
      const el = document.createElement('textarea');
      el.innerHTML = text;
      navigator.clipboard.writeText(el.value).then(() => showToast('已复制'));
    }

    // Auto-generate on load
    generate();
  </script>
</body>
</html>
