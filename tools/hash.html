<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哈希计算器 - DevToolBox</title>
  <meta name="description" content="在线计算文本或文件的MD5、SHA-1、SHA-256、SHA-512哈希值">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .editor-area { width: 100%; min-height: 150px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; resize: vertical; box-sizing: border-box; }
    .editor-area:focus { outline: none; border-color: var(--accent); }
    .file-input-wrapper { position: relative; display: inline-block; margin-bottom: 12px; }
    .file-input-wrapper input[type="file"] { display: none; }
    .file-input-wrapper .file-btn { display: inline-block; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 20px; cursor: pointer; transition: all 0.2s; font-size: 14px; }
    .file-input-wrapper .file-btn:hover { border-color: var(--accent); color: var(--accent); }
    .file-name { color: var(--text2); font-size: 13px; margin-left: 12px; }
    .hash-row { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
    .hash-row .hash-algo { color: var(--accent); font-family: 'Consolas', monospace; font-weight: 700; min-width: 70px; font-size: 13px; }
    .hash-row .hash-value { flex: 1; font-family: 'Consolas', monospace; font-size: 13px; color: var(--text); word-break: break-all; }
    .hash-row button { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text2); padding: 4px 10px; cursor: pointer; font-size: 12px; transition: all 0.2s; white-space: nowrap; }
    .hash-row button:hover { border-color: var(--accent); color: var(--accent); }
    .mode-toggle { display: flex; gap: 0; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: fit-content; }
    .mode-toggle button { background: var(--surface); color: var(--text2); border: none; padding: 8px 20px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .mode-toggle button.active { background: var(--accent); color: var(--bg); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回工具箱</a>
    <div class="tool-page">
      <div class="tool-header">
        <h1>🧮 哈希计算器</h1>
        <p>计算文本或文件的 MD5、SHA-1、SHA-256、SHA-512 哈希值</p>
      </div>

      <div class="mode-toggle">
        <button class="active" id="modeText" onclick="switchMode('text')">文本模式</button>
        <button id="modeFile" onclick="switchMode('file')">文件模式</button>
      </div>

      <div id="textMode">
        <div class="label">输入文本</div>
        <textarea class="editor-area" id="textInput" placeholder="输入要计算哈希的文本..."></textarea>
      </div>

      <div id="fileMode" style="display:none;">
        <div class="file-input-wrapper">
          <label class="file-btn" for="fileInput">📁 选择文件</label>
          <input type="file" id="fileInput" onchange="handleFile(this)">
        </div>
        <span class="file-name" id="fileName"></span>
      </div>

      <div class="btn-group" style="margin-top:12px;">
        <button class="btn btn-primary" onclick="computeAll()">计算所有哈希</button>
      </div>

      <div id="hashResults" style="margin-top:20px;"></div>
    </div>
  </div>
  <div class="toast" id="toast">已复制</div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg || '已复制';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    let currentMode = 'text';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('textMode').style.display = mode === 'text' ? 'block' : 'none';
      document.getElementById('fileMode').style.display = mode === 'file' ? 'block' : 'none';
      document.getElementById('modeText').classList.toggle('active', mode === 'text');
      document.getElementById('modeFile').classList.toggle('active', mode === 'file');
    }

    // MD5 implementation
    const MD5 = (function() {
      function safeAdd(x, y) { const l = (x & 0xFFFF) + (y & 0xFFFF); return (((x >> 16) + (y >> 16) + (l >> 16)) << 16) | (l & 0xFFFF); }
      function bitRotateLeft(num, cnt) { return (num << cnt) | (num >>> (32 - cnt)); }
      function md5cmn(q, a, b, x, s, t) { return safeAdd(bitRotateLeft(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b); }
      function md5ff(a, b, c, d, x, s, t) { return md5cmn((b & c) | ((~b) & d), a, b, x, s, t); }
      function md5gg(a, b, c, d, x, s, t) { return md5cmn((b & d) | (c & (~d)), a, b, x, s, t); }
      function md5hh(a, b, c, d, x, s, t) { return md5cmn(b ^ c ^ d, a, b, x, s, t); }
      function md5ii(a, b, c, d, x, s, t) { return md5cmn(c ^ (b | (~d)), a, b, x, s, t); }
      function binlMD5(x, len) {
        x[len >> 5] |= 0x80 << (len % 32);
        x[((len + 64) >>> 9 << 4) + 14] = len;
        let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
        for (let i = 0; i < x.length; i += 16) {
          const oa = a, ob = b, oc = c, od = d;
          a = md5ff(a,b,c,d,x[i],7,-680876936); d = md5ff(d,a,b,c,x[i+1],12,-389564586);
          c = md5ff(c,d,a,b,x[i+2],17,606105819); b = md5ff(b,c,d,a,x[i+3],22,-1044525330);
          a = md5ff(a,b,c,d,x[i+4],7,-176418897); d = md5ff(d,a,b,c,x[i+5],12,1200080426);
          c = md5ff(c,d,a,b,x[i+6],17,-1473231341); b = md5ff(b,c,d,a,x[i+7],22,-45705983);
          a = md5ff(a,b,c,d,x[i+8],7,1770035416); d = md5ff(d,a,b,c,x[i+9],12,-1958414417);
          c = md5ff(c,d,a,b,x[i+10],17,-42063); b = md5ff(b,c,d,a,x[i+11],22,-1990404162);
          a = md5ff(a,b,c,d,x[i+12],7,1804603682); d = md5ff(d,a,b,c,x[i+13],12,-40341101);
          c = md5ff(c,d,a,b,x[i+14],17,-1502002290); b = md5ff(b,c,d,a,x[i+15],22,1236535329);
          a = md5gg(a,b,c,d,x[i+1],5,-165796510); d = md5gg(d,a,b,c,x[i+6],9,-1069501632);
          c = md5gg(c,d,a,b,x[i+11],14,643717713); b = md5gg(b,c,d,a,x[i],20,-373897302);
          a = md5gg(a,b,c,d,x[i+5],5,-701558691); d = md5gg(d,a,b,c,x[i+10],9,38016083);
          c = md5gg(c,d,a,b,x[i+15],14,-660478335); b = md5gg(b,c,d,a,x[i+4],20,-405537848);
          a = md5gg(a,b,c,d,x[i+9],5,568446438); d = md5gg(d,a,b,c,x[i+14],9,-1019803690);
          c = md5gg(c,d,a,b,x[i+3],14,-187363961); b = md5gg(b,c,d,a,x[i+8],20,1163531501);
          a = md5gg(a,b,c,d,x[i+13],5,-1444681467); d = md5gg(d,a,b,c,x[i+2],9,-51403784);
          c = md5gg(c,d,a,b,x[i+7],14,1735328473); b = md5gg(b,c,d,a,x[i+12],20,-1926607734);
          a = md5hh(a,b,c,d,x[i+5],4,-378558); d = md5hh(d,a,b,c,x[i+8],11,-2022574463);
          c = md5hh(c,d,a,b,x[i+11],16,1839030562); b = md5hh(b,c,d,a,x[i+14],23,-35309556);
          a = md5hh(a,b,c,d,x[i+1],4,-1530992060); d = md5hh(d,a,b,c,x[i+4],11,1272893353);
          c = md5hh(c,d,a,b,x[i+7],16,-155497632); b = md5hh(b,c,d,a,x[i+10],23,-1094730640);
          a = md5hh(a,b,c,d,x[i+13],4,681279174); d = md5hh(d,a,b,c,x[i],11,-358537222);
          c = md5hh(c,d,a,b,x[i+3],16,-722521979); b = md5hh(b,c,d,a,x[i+6],23,76029189);
          a = md5hh(a,b,c,d,x[i+9],4,-640364487); d = md5hh(d,a,b,c,x[i+12],11,-421815835);
          c = md5hh(c,d,a,b,x[i+15],16,530742520); b = md5hh(b,c,d,a,x[i+2],23,-995338651);
          a = md5ii(a,b,c,d,x[i],6,-198630844); d = md5ii(d,a,b,c,x[i+7],10,1126891415);
          c = md5ii(c,d,a,b,x[i+14],15,-1416354905); b = md5ii(b,c,d,a,x[i+5],21,-57434055);
          a = md5ii(a,b,c,d,x[i+12],6,1700485571); d = md5ii(d,a,b,c,x[i+3],10,-1894986606);
          c = md5ii(c,d,a,b,x[i+10],15,-1051523); b = md5ii(b,c,d,a,x[i+1],21,-2054922799);
          a = md5ii(a,b,c,d,x[i+8],6,1873313359); d = md5ii(d,a,b,c,x[i+15],10,-30611744);
          c = md5ii(c,d,a,b,x[i+6],15,-1560198380); b = md5ii(b,c,d,a,x[i+13],21,1309151649);
          a = md5ii(a,b,c,d,x[i+4],6,-145523070); d = md5ii(d,a,b,c,x[i+11],10,-1120210379);
          c = md5ii(c,d,a,b,x[i+2],15,718787259); b = md5ii(b,c,d,a,x[i+9],21,-343485551);
          a = safeAdd(a, oa); b = safeAdd(b, ob); c = safeAdd(c, oc); d = safeAdd(d, od);
        }
        return [a, b, c, d];
      }
      function str2binl(str) {
        const bin = [];
        const mask = (1 << 8) - 1;
        for (let i = 0; i < str.length * 8; i += 8) bin[i >> 5] |= (str.charCodeAt(i / 8) & mask) << (i % 32);
        return bin;
      }
      function binl2hex(binarray) {
        const hexTab = '0123456789abcdef';
        let str = '';
        for (let i = 0; i < binarray.length * 4; i++) {
          str += hexTab.charAt((binarray[i >> 2] >> ((i % 4) * 8 + 4)) & 0xF) + hexTab.charAt((binarray[i >> 2] >> ((i % 4) * 8)) & 0xF);
        }
        return str;
      }
      return function(str) {
        const utf8 = unescape(encodeURIComponent(str));
        return binl2hex(binlMD5(str2binl(utf8), utf8.length * 8));
      };
    })();

    async function shaHash(algo, data) {
      const hashBuffer = await crypto.subtle.digest(algo, data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function handleFile(input) {
      if (input.files.length > 0) {
        document.getElementById('fileName').textContent = input.files[0].name;
      }
    }

    async function computeAll() {
      const resultsEl = document.getElementById('hashResults');
      resultsEl.innerHTML = '<div style="color:var(--text2);padding:12px;">计算中...</div>';

      let data;
      try {
        if (currentMode === 'text') {
          const text = document.getElementById('textInput').value;
          if (!text) { showToast('请输入文本'); resultsEl.innerHTML = ''; return; }
          data = new TextEncoder().encode(text);
        } else {
          const fileInput = document.getElementById('fileInput');
          if (!fileInput.files.length) { showToast('请选择文件'); resultsEl.innerHTML = ''; return; }
          data = await fileInput.files[0].arrayBuffer();
        }
      } catch (e) {
        resultsEl.innerHTML = `<div style="color:#f87171;">错误：${e.message}</div>`;
        return;
      }

      const algorithms = [
        { name: 'MD5', algo: null },
        { name: 'SHA-1', algo: 'SHA-1' },
        { name: 'SHA-256', algo: 'SHA-256' },
        { name: 'SHA-512', algo: 'SHA-512' }
      ];

      let html = '';
      for (const alg of algorithms) {
        let hash;
        if (alg.name === 'MD5') {
          if (data instanceof ArrayBuffer) {
            // Convert ArrayBuffer to string for MD5
            const bytes = new Uint8Array(data);
            let str = '';
            bytes.forEach(b => str += String.fromCharCode(b));
            hash = MD5(str);
          } else {
            hash = MD5(new TextDecoder().decode(data));
          }
        } else {
          hash = await shaHash(alg.algo, data);
        }
        html += `<div class="hash-row">
          <span class="hash-algo">${alg.name}</span>
          <span class="hash-value" id="hash_${alg.name}">${hash}</span>
          <button onclick="copyHash('${alg.name}')">复制</button>
        </div>`;
      }
      resultsEl.innerHTML = html;
    }

    function copyHash(algo) {
      const el = document.getElementById('hash_' + algo);
      if (el) navigator.clipboard.writeText(el.textContent).then(() => showToast(algo + ' 已复制'));
    }
  </script>
</body>
</html>
